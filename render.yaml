# Blueprint para la versión dinámica (independiente del sitio estático actual).
# IMPORTANTE: PostgreSQL Free caduca después de 30 días en Render.
services:
  - type: web
    name: preuniversitario-app
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT server:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: preuniversitario-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
databases:
  - name: preuniversitario-db
    plan: free
    databaseName: preuniversitario
    user: preuniversitario
